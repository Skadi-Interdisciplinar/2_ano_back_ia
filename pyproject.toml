[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Trimmy"
version = "0.1.0"
description = "agente de IA com LangChain e FastAPI"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Skadi Interdisciplinar" },
]
keywords = ["langchain", "agente", "fastapi", "llm"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyJWT>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agente_ia"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/agente_ia",
  "/pyproject.toml",
  "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
