[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Trimmy"
version = "0.1.0"
description = "agente de IA com LangChain e FastAPI"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Skadi Interdisciplinar" },
]
keywords = ["langchain", "agente", "fastapi", "llm"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "langchain>=1",
  "langchain-core>=1",
  "langchain-google-genai>=4",
  "langchain-groq>=1",
  "langgraph>=1",
  "pydantic>=2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "qdrant-client",
  "pymongo",
  "psycopg2-binary",
  "redis",
  "google-genai",
  "groq",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/scripts",
  "/tests",
  "/requirements.txt",
  "/pytest.ini",
  "/pyproject.toml",
  "/LICENSE",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
