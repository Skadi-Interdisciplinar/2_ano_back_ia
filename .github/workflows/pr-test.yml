name: 1 - Validação e Testes do PR (FastAPI Agent)

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened
    
    branches: [ "main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fastapi-agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-pr:
    name: Testar API do Agente
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx ruff

      - name: Checagem de Sintaxe (Ruff)
        run: ruff check .

      - name: Executar Testes Unitários e de Integração
        id: run_tests
        continue-on-error: true
        run: pytest -v

      - name: Gerenciar Labels de Teste no PR
        uses: actions/github-script@v7
        with:
          script: |
            const testStatus = '${{ steps.run_tests.outcome }}';
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Busca todas as etiquetas atuais do PR
            const { data: prInfo } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });

            // 2. Remove todas as etiquetas antigas no padrão tests-*
            const oldLabels = prInfo.labels
              .map(l => l.name)
              .filter(name => name.startsWith('tests-'));

            for (const labelName of oldLabels) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: labelName
              });
            }

            // 3. Define e adiciona a nova etiqueta baseada no resultado atual
            const newLabel = (testStatus === 'success') ? 'tests-passed' : 'tests-failed';
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [newLabel]
            });

            // 4. Se os testes falharam, marca o Job como falho para travar o merge
            if (testStatus !== 'success') {
              core.setFailed('Os testes automatizados da API falharam!');
            }